<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>请完成校验</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:#f7f8fa;color:#1f2329;
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
      -webkit-font-smoothing:antialiased}
    .page{min-height:100%;display:flex;flex-direction:column}
    .header{height:56px;display:flex;align-items:center;padding:0 24px;background:#fff;
      border-bottom:1px solid #e5e6eb}
    .header .logo{font-size:18px;font-weight:600;color:#1f2329;letter-spacing:.5px}
    .header .nav{margin-left:auto;display:flex;gap:24px;font-size:14px;color:#646a73}
    .header .nav a{color:inherit;text-decoration:none}
    .main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:48px 16px}
    .card{width:100%;max-width:420px;background:#fff;border-radius:8px;padding:36px 28px;
      box-shadow:0 2px 12px rgba(31,35,41,.06);text-align:center}
    .card .icon{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#fff3e8;
      display:flex;align-items:center;justify-content:center;font-size:28px;color:#ff7d00}
    .card h1{margin:0 0 12px;font-size:18px;font-weight:600;line-height:1.5}
    .card p{margin:0 0 8px;font-size:14px;line-height:1.9;color:#646a73}
    .card .hint{font-size:12px;color:#8f959e;line-height:1.8}
    .form{margin-top:24px;display:flex;gap:10px}
    .form input{flex:1 1 auto;height:40px;border:1px solid #dee0e3;border-radius:4px;
      padding:0 12px;font-size:14px;outline:none}
    .form input:focus{border-color:#3370ff}
    .form button{height:40px;padding:0 18px;border:none;border-radius:4px;background:#3370ff;
      color:#fff;font-size:14px;cursor:pointer}
    .form button:hover{background:#2b5fd9}
    .footer{padding:20px 24px;text-align:center;font-size:12px;color:#8f959e;line-height:1.8}
    .footer a{color:inherit;text-decoration:none;margin:0 8px}
    .divider{height:1px;background:#eff0f1;margin:24px 0}
    .tips{text-align:left;font-size:12px;color:#8f959e;line-height:2;margin:0;padding-left:18px}
    .tips li{margin-bottom:2px}
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <span class="logo">内容社区</span>
      <nav class="nav">
        <a href="/">首页</a>
        <a href="/explore">发现</a>
        <a href="/about">关于</a>
      </nav>
    </header>
    <main class="main">
      <div class="card">
        <div class="icon">!</div>
        <h1>请完成校验后继续访问</h1>
        <p>为确认本次访问由本人发起，请填写下图中的验证码。</p>
        <div class="form">
          <input type="text" inputmode="numeric" maxlength="6" placeholder="请输入验证码">
          <button type="button">提交</button>
        </div>
        <div class="divider"></div>
        <ul class="tips">
          <li>校验结果仅在本次会话内有效，关闭页面后需重新校验。</li>
          <li>若多次填写错误，页面会暂时锁定一段时间。</li>
          <li>遇到问题可通过页脚的帮助中心联系我们。</li>
        </ul>
      </div>
    </main>
    <footer class="footer">
      <a href="/terms">用户协议</a>
      <a href="/privacy">隐私政策</a>
      <a href="/help">帮助中心</a>
      <div>© 2026 内容社区</div>
    </footer>
  </div>
</body>
</html>
