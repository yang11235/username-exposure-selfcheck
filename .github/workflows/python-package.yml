name: Linting and testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          python -m poetry install --with dev

      - name: Test with Coverage and Pytest (fail if coverage is low)
        run: |
          poetry run coverage run --source=./maigret -m pytest --reruns 3 --reruns-delay 5 tests
          poetry run coverage report --fail-under=60
          poetry run coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov-${{ strategy.job-index }}
          path: htmlcov

  lint:
    # 只 lint 本仓库自己维护的代码，不碰上游留下的 maigret/*.py 与 tests/。
    #
    # 为什么限定范围：上游代码里有一百多处既存告警（E501 长行、E731 lambda
    # 赋值、测试里的重复函数名……）。把全仓纳入等于要么先改几百行上游代码
    # （diff 被污染，以后合上游更新满屏冲突），要么把规则放宽到形同虚设。
    # 而 cn/ 与 web/ 是这轮新增的、真正会改坏的地方——它们必须干净。
    #
    # E203 排除：black 风格的切片写作 `x[1 : 2]`，与 PEP8 的"冒号前不留空格"
    # 冲突，这是 black 与 flake8 的已知分歧，不是代码问题。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flake8
        # 钉大版本上限：flake8/pycodestyle 新增检查项是大版本常态，
        # 不设上限的话某天 runner 装到 8.x，会因为一条新规则让所有 PR 变红。
        run: python -m pip install "flake8>=7.1.1,<8"

      - name: Lint maintained code
        run: |
          flake8 --max-line-length 110 --extend-ignore E203 \
            maigret/cn maigret/web utils wizard.py

  minimal-install:
    # Verify a fresh `pip install maigret` succeeds and the test suite
    # passes WITHOUT the optional [pdf] extra and WITHOUT system cairo.
    # Catches regressions where core code accidentally grows a hard
    # dependency on xhtml2pdf / pycairo / libcairo2.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Maigret without [pdf] extra (no libcairo on host)
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-asyncio pytest-rerunfailures pytest-httpserver

      - name: Smoke-check the install
        run: |
          python -c "import maigret; from maigret.report import save_pdf_report; print('import OK')"
          maigret --version

      - name: Run tests without [pdf] extra
        run: pytest --reruns 3 --reruns-delay 5 tests